<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte défi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#C9971F}a:hover{color:#E3B23C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; flex-direction: column;">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 54px 20px 0;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 42px; height: 42px; border-radius: 50%; background: #E05A2B; color: #0F0E1A; box-shadow: 0 0 0 2px {{t.bg}}, 0 0 0 3.5px {{t.gold}}; display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 20px;">K</div>
      <div style="display: flex; flex-direction: column;">
        <span style="font-size: 16px; font-weight: 800;">Kofi</span>
        <span style="font-size: 13px; color: {{t.muted}};">Posé par Yann</span>
      </div>
    </div>
    <div role="timer" aria-label="42 secondes restantes" style="position: relative; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center;">
      <span aria-hidden="true" style="position: absolute; width: 40px; height: 40px; border: 1.5px solid {{t.gold}}; transform: rotate(45deg);"></span>
      <span aria-hidden="true" style="position: absolute; width: 48px; height: 48px; border: 1px dashed {{t.line}}; transform: rotate(45deg);"></span>
      <span style="position: relative; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums;">42</span>
    </div>
  </header>

  <article style="position: relative; margin: 34px 26px 0; height: 470px; border-radius: 22px; background: {{c.face}}; color: {{c.ink}}; transform: rotate(-1.5deg); box-shadow: 0 30px 60px {{t.shadow}}; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column;">
    <div aria-hidden="true" style="position: absolute; left: 9px; top: 9px; right: 9px; bottom: 9px; border: 1.3px solid {{c.rim}}; border-radius: 15px;"></div>
    <div style="position: relative; display: flex; justify-content: space-between; align-items: flex-start;">
      <span style="font-family: 'DM Serif Display', serif; font-size: 30px; line-height: 0.9; color: {{c.accent}};">{{c.letter}}<br><span style="font-size: 14px; color: {{c.rim}};">◆</span></span>
      <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.18em; padding-top: 6px;">{{c.category}}</span>
    </div>
    <div aria-hidden="true" style="position: relative; display: flex; height: 10px; margin: 18px 0 0;">
      <span style="flex: 3 1 0; background: #E3B23C;"></span><span style="flex: 1 1 0; background: #E05A2B;"></span><span style="flex: 2 1 0; background: {{c.band}};"></span><span style="flex: 1 1 0; background: #E05A2B;"></span><span style="flex: 3 1 0; background: #E3B23C;"></span><span style="flex: 1 1 0; background: #E05A2B;"></span><span style="flex: 2 1 0; background: {{c.band}};"></span><span style="flex: 1 1 0; background: #E05A2B;"></span><span style="flex: 3 1 0; background: #E3B23C;"></span>
    </div>
    <h1 style="position: relative; margin: 22px 0 0; font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 54px; line-height: 0.95; color: {{c.accent}};">{{c.label}}</h1>
    <p style="position: relative; margin: 16px 0 0; font-size: 22px; font-weight: 600; line-height: 1.4; letter-spacing: -0.01em;">{{c.text}}</p>
    <div style="position: relative; margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end;">
      <div aria-label="Intensité 3 sur 4" style="display: flex; gap: 6px;">
        <span style="width: 10px; height: 10px; background: {{c.accent}}; transform: rotate(45deg);"></span>
        <span style="width: 10px; height: 10px; background: {{c.accent}}; transform: rotate(45deg);"></span>
        <span style="width: 10px; height: 10px; background: {{c.accent}}; transform: rotate(45deg);"></span>
        <span style="width: 8px; height: 8px; border: 1.2px solid {{c.rim}}; transform: rotate(45deg);"></span>
      </div>
      <span style="transform: rotate(180deg); font-family: 'DM Serif Display', serif; font-size: 30px; line-height: 0.9; color: {{c.accent}};">{{c.letter}}<br><span style="font-size: 14px; color: {{c.rim}};">◆</span></span>
    </div>
  </article>

  <div style="margin-top: auto; padding: 0 20px 40px; display: flex; flex-direction: column; gap: 10px;">
    <button style="height: 60px; border: 0; border-radius: 16px; background: {{t.gold}}; color: {{t.onGold}}; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 0.06em; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      C'EST FAIT · {{c.points}}
    </button>
    <button style="height: 52px; border: 1.5px solid {{t.line}}; border-radius: 16px; background: transparent; color: {{t.text}}; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 600;">Passer · −1 pt · 2 restantes</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["nuit","ivoire","terre"],"default":"nuit"},"kind":{"editor":"enum","options":["action","verite"],"default":"action"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const THEMES = {
      nuit: { bg: '#0F0E1A', text: '#F4ECDD', muted: '#CFC7B8', line: 'rgba(227,178,60,0.45)', gold: '#E3B23C', onGold: '#0F0E1A', shadow: 'rgba(0,0,0,0.6)' },
      ivoire: { bg: '#F4ECDD', text: '#1A1726', muted: '#544C60', line: 'rgba(138,100,16,0.4)', gold: '#C9971F', onGold: '#1A1726', shadow: 'rgba(70,45,10,0.28)' },
      terre: { bg: '#3A1E14', text: '#F7E9D7', muted: '#E0C9B0', line: 'rgba(227,178,60,0.5)', gold: '#E3B23C', onGold: '#2A140C', shadow: 'rgba(0,0,0,0.5)' },
    };
    const truth = (this.props.kind ?? 'action') === 'verite';
    const c = truth
      ? { face: '#4757E8', ink: '#F4ECDD', rim: '#E3B23C', accent: '#F4ECDD', band: '#0F0E1A', letter: 'V', label: 'Vérité', category: 'LIMITE FRANCHISE', points: '+1',
          text: 'Qu’est-ce que tu n’as jamais osé dire à quelqu’un autour de cette table ?' }
      : { face: '#FFFCF5', ink: '#0F0E1A', rim: '#C99A2E', accent: '#C2441A', band: '#4757E8', letter: 'A', label: 'Action', category: 'OSÉ', points: '+2',
          text: 'Choisis quelqu’un et murmure-lui un compliment que personne d’autre ne doit entendre.' };
    return { t: THEMES[this.props.theme ?? 'nuit'] ?? THEMES.nuit, c };
  }
}
</script>
</body>
</html>
